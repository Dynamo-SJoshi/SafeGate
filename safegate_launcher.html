<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeGate Launcher</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --good: #10b981;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .card {
      background-color: var(--panel);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2937;
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    
    h1 {
      margin-top: 0;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    p {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 1rem;
      line-height: 1.5;
    }
    
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .btn:hover {
      background-color: var(--primary-hover);
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .footnote {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SafeGate Launcher</h1>
    <p>Click the button below to launch both the frontend and wake up the backend simultaneously on Render.</p>
    
    <button class="btn" id="launchBtn">Launch SafeGate</button>
    
    <div class="footnote">
      * Please allow popups if prompted by your browser.
    </div>
  </div>

  <script>
    document.getElementById("launchBtn").addEventListener("click", () => {
      // Replace these URLs if they are different in your actual hosting setup
      const frontendUrl = "https://safegate-frontend.onrender.com"; 
      const backendHealthUrl = "https://safegate-backend-otnm.onrender.com";
      
      window.open(frontendUrl, "_blank");
      window.open(backendHealthUrl, "_blank");
    });
  </script>
</body>
</html>
