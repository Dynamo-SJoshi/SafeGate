services:
  # 1. Redis instance for RQ scanning queue
  - type: redis
    name: safegate-redis
    plan: free
    ipAllowList: [] # Only allow internal network access

  # 2. FastAPI Backend + RQ Worker (combined into a single Docker service)
  - type: web
    name: safegate-backend
    plan: free
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.render
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: safegate-redis
          property: connectionString
      - key: PORT
        value: "8000"
      - key: ENABLE_CLAMAV
        value: "false"
      - key: ENABLE_SANDBOX
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 3. Next.js React Frontend
  - type: web
    name: safegate-frontend
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: BACKEND_URL
        value: http://safegate-backend:8000
      - key: NODE_VERSION
        value: "20"
